# Simple setup for testing SRAKE: builds the image (API + embedded web UI) and
# serves it on http://localhost:8080.
#
# Provide a database by placing srake.db in ./data (host) — it is mounted at
# /data/srake.db inside the container. To build one, run `srake ingest` against
# a mounted archive, or mount an existing database read-only.
services:
  srake:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: srake:local
    container_name: srake
    ports:
      - "8080:8080"
    volumes:
      # Host ./data holds srake.db (and the search index). Create ./data first.
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
